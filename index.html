<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi Granjita</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Granjita">
<meta name="theme-color" content="#b8432f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;touch-action:manipulation;overscroll-behavior:none}
#app{padding-top:max(10px,env(safe-area-inset-top,0px))!important;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: columna con forma de móvil — animales, aros de estado y nivel, escena de la habitación, bandeja de objetos, menú de habitaciones */
:root{
  --sky:#9ad7f2; --grass:#78c257; --barn:#b8432f; --wood:#a76a3c; --wood-d:#8c5530;
  --hay:#f1cd5c; --paper:#fffaf0; --cream:#f5ead4; --ink:#3a2a1f; --ink-soft:#6d5a4b;
  --soil:#7a4e2d; --good:#45a849; --warn:#f0a22e; --bad:#df4f3b; --coin:#f6c445;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  background:var(--barn);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 44px);
  font-family:var(--body); color:var(--ink); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #1f6feb;outline-offset:2px}
#app{
  height:100%; max-width:480px; margin:0 auto; background:var(--paper);
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto auto; grid-template-columns:minmax(0,1fr); gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px; box-shadow:0 0 0 4px var(--ink);
}
/* cabecera */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:4px 2px 6px;scrollbar-width:thin}
.tab{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);padding:2px;transition:transform .15s}
.tab svg{width:100%;height:100%;display:block}
.tab[aria-selected="true"]{background:var(--hay);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.tab.locked svg{filter:grayscale(1) brightness(.6);opacity:.5}
.tab .lock{position:absolute;inset:0;display:grid;place-items:center;font:800 11px/1 var(--display);color:var(--paper);text-shadow:0 1px 2px #000}
.tab .dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--bad);border:2px solid var(--paper);color:#fff;font:800 11px/12px var(--body);text-align:center}
.coins{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:99px;padding:5px 12px 5px 6px;font:800 16px var(--display);font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--coin) 55%,#c9931c);border:2px solid #8a5f10;display:inline-block;flex:0 0 auto}
.iconbtn{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font:18px var(--emoji);flex:0 0 auto}
/* estado */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ring{--v:50;--c:var(--good);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),#e6d8bf 0);border:3px solid var(--ink)}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:17px var(--emoji)}
.ring span.lvn{font:800 18px var(--display)}
.stat b{font:700 11px/1.2 var(--body);color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:center;max-width:100%;overflow-wrap:anywhere}
.ring.low{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
/* escena */
.scene{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;min-height:0;isolation:isolate}
.room-comer{background:
  repeating-linear-gradient(0deg,#e2bb4f 0 6px,var(--hay) 6px 14px) bottom/100% 24% no-repeat,
  repeating-linear-gradient(90deg,var(--wood) 0 40px,var(--wood-d) 40px 43px)}
.room-lavar{background:
  linear-gradient(#5fb0dc,#3f93c4) bottom/100% 22% no-repeat,
  repeating-linear-gradient(0deg,transparent 0 36px,rgba(255,255,255,.85) 36px 39px),
  repeating-linear-gradient(90deg,transparent 0 36px,rgba(255,255,255,.85) 36px 39px),#bfe6f5}
.room-dormir{background:
  repeating-linear-gradient(0deg,#cfa43f 0 6px,#e0b74c 6px 14px) bottom/100% 24% no-repeat,
  repeating-linear-gradient(90deg,#8a5a34 0 40px,#734727 40px 43px)}
.room-jugar{background:
  radial-gradient(120% 60% at 30% 100%,#69b548 60%,transparent 61%),
  radial-gradient(110% 55% at 85% 100%,var(--grass) 60%,transparent 61%),
  linear-gradient(#7cc8ee,#c9ecfb 70%)}
.room-huerto{background:
  repeating-linear-gradient(0deg,#6e4528 0 10px,var(--soil) 10px 20px) bottom/100% 72% no-repeat,
  linear-gradient(#7cc8ee,#c9ecfb)}
.room-tienda{background:
  repeating-linear-gradient(90deg,#d8452f 0 30px,#fff6e8 30px 60px) top/100% 34px no-repeat,
  linear-gradient(transparent 33%,#6b4426 33% 35%,transparent 35% 62%,#6b4426 62% 64%,transparent 64%),
  repeating-linear-gradient(90deg,#e8d3ae 0 40px,#dcc39a 40px 43px)}
.roomname{position:absolute;top:10px;left:12px;z-index:3;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:0 10px;font:800 15px/26px var(--display)}
.room-tienda .roomname{top:42px}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.win{position:absolute;top:14%;right:9%;width:72px;height:72px;border:5px solid #5b3a20;border-radius:6px;background:linear-gradient(var(--sky),#d6f1fc);overflow:hidden}
.win::before,.win::after{content:"";position:absolute;background:#5b3a20}
.win::before{left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px}
.win::after{top:50%;left:0;right:0;height:5px;margin-top:-2.5px}
.night .win{background:linear-gradient(#1b2350,#2f3a78)}
.moon{position:absolute;top:8px;left:10px;width:22px;height:22px;border-radius:50%;box-shadow:6px 4px 0 0 #fff4c2}
.sun{position:absolute;top:8%;right:10%;width:58px;height:58px;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 10px rgba(255,216,74,.35)}
.room-huerto .sun{top:4%;width:40px;height:40px}
.cloud{position:absolute;height:22px;border-radius:20px;background:#fff;animation:drift 40s linear infinite}
.cloud::before{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;left:14px;top:-14px}
.fence{position:absolute;left:0;right:0;bottom:22%;height:42px;
  background:linear-gradient(transparent 10px,#fff 10px 17px,transparent 17px 27px,#fff 27px 34px,transparent 34px),
  repeating-linear-gradient(90deg,transparent 0 30px,#fff 30px 40px);opacity:.9}
.trough{position:absolute;left:50%;bottom:3%;width:62%;height:7%;transform:translateX(-50%);background:#6b4426;border:3px solid var(--ink);border-radius:4px 4px 18px 18px;z-index:0}
.mirror{position:absolute;top:22%;right:7%;width:62px;height:88px;border-radius:40px 40px 8px 8px;border:5px solid #c9931c;background:linear-gradient(135deg,#e9f7ff 30%,#bfe3f5 60%,#e9f7ff 70%)}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
.pet{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);height:min(70%,310px);aspect-ratio:1;max-width:86%;z-index:1;cursor:pointer;touch-action:none}
.pet svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 95%;animation:breathe 3.2s ease-in-out infinite}
.pet.jump svg{animation:hop .5s ease-out}
.pet.shake svg{animation:nope .55s ease-in-out}
.pet.sick svg{filter:saturate(.5) hue-rotate(40deg) brightness(.97)}
@keyframes breathe{50%{transform:scale(1.02,.975)}}
@keyframes hop{30%{transform:translateY(-14%) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.93)}}
@keyframes nope{20%{transform:rotate(-7deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
.petname{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,60%);white-space:nowrap;background:var(--ink);color:var(--paper);border-radius:99px;padding:0 12px;font:800 14px/24px var(--display)}
.petname.sick{background:#4f7a2e}
svg .eye{transform-box:fill-box;transform-origin:center;transition:transform .08s}
svg.blink .eye{transform:scaleY(.1)}
svg .shut,svg .brows{display:none}
svg.sleep .eye,svg.sleep .glasses{display:none} svg.sleep .shut{display:inline}
svg.sad .brows{display:inline}
.dark{position:absolute;inset:0;background:rgba(10,14,46,.66);opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}
.night .dark{opacity:1}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.35) 40%,rgba(160,215,255,.5));border:2px solid rgba(255,255,255,.9);animation:bub 1.6s ease-out forwards}
@keyframes bub{to{transform:translateY(-40px) scale(1.2);opacity:0}}
.drop{position:absolute;top:-20px;width:6px;height:16px;border-radius:6px;background:#4aa7e0;animation:fall .8s linear forwards}
@keyframes fall{to{transform:translateY(520px)}}
.heart{position:absolute;color:#e8435a;font:800 28px var(--display);animation:rise 1.4s ease-out forwards}
.heart.e{font-family:var(--emoji)}
@keyframes rise{to{transform:translateY(-90px) scale(1.4);opacity:0}}
.zzz{position:absolute;font:800 26px var(--display);color:#fff;animation:zz 2.4s ease-in-out infinite;opacity:0}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(30px,-70px) scale(1.2);opacity:0}}
.bubble{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(88%,360px);z-index:5;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;font:700 15px/1.35 var(--body);text-align:center;box-shadow:0 4px 0 var(--ink);animation:pop .25s ease-out}
.room-tienda .bubble{top:76px}
.bubble b{font-family:var(--display);font-weight:800}
.bubble.bad{background:#ffe9e4}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
.prod{position:absolute;right:8%;top:38%;z-index:3;width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:32px/1 var(--emoji);box-shadow:0 4px 0 var(--ink);animation:bob 1.2s ease-in-out infinite}
.prod::after{content:"¡Recoger!";position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;background:var(--hay);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font:800 11px/18px var(--display)}
@keyframes bob{50%{transform:translateY(-8px)}}
/* huerto */
.garden{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:92%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;z-index:1}
.plot{position:relative;aspect-ratio:1/1;max-height:22vh;border:3px solid var(--ink);border-radius:16px;background:repeating-linear-gradient(0deg,#5c3a20 0 8px,#6e4528 8px 16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;padding:4px}
.plot .e{font:34px/1 var(--emoji)}
.plot.ripe .e{animation:bob 1s ease-in-out infinite}
.plot.ripe{box-shadow:0 0 0 3px var(--hay)}
.plot small{font:800 11px var(--display);text-shadow:0 1px 2px #000;white-space:nowrap}
.plot .bar{width:80%;height:6px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.plot .bar i{display:block;height:100%;background:var(--grass)}
.plot .w{position:absolute;top:2px;right:4px;font:14px var(--emoji)}
/* bandeja */
.tray{min-height:100px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.hint{font:700 13px var(--body);color:var(--ink-soft);text-align:center;text-wrap:balance}
.foods{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.item{position:relative;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;touch-action:none;transition:transform .1s;min-width:0}
.item:active{transform:scale(.94)}
.item .e{font:24px/1.15 var(--emoji)}
.item .p{display:flex;align-items:center;gap:3px;font:800 12px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .p .coin{width:11px;height:11px;border-width:1px}
.item .p.have{color:var(--good)}
.item.sel{background:var(--hay);box-shadow:0 3px 0 var(--ink)}
.item.on{background:#d9f3d5}
.item .tag{font:800 10px var(--display);color:var(--ink-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.big{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:7px 12px;font:800 15px var(--display);box-shadow:0 3px 0 var(--ink);touch-action:none}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.big .e{font:22px var(--emoji)}
.big.hot{background:var(--hay)}
/* habitaciones */
.rooms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.room{border:3px solid var(--ink);border-radius:14px;background:var(--cream);padding:3px 0;display:flex;flex-direction:column;align-items:center;font:800 11px var(--display);min-width:0}
.room .e{font:20px/1.2 var(--emoji)}
.room[aria-current="true"]{background:var(--barn);color:#fff}
.ghost{position:fixed;left:0;top:0;margin:-28px 0 0 -28px;font:48px/56px var(--emoji);pointer-events:none;z-index:50;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(40,25,15,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{position:relative;width:min(100%,420px);max-height:100%;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--ink)}
.card h2{margin:0 36px 4px 0;font:800 26px/1.1 var(--display);text-wrap:balance}
.card .sub{margin:0 0 12px;color:var(--ink-soft);font-weight:700;line-height:1.4}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 18px var(--display)}
.qtext{font:800 19px/1.3 var(--display);margin:6px 0 12px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;font:700 15px var(--body)}
.opt .e{font:22px var(--emoji);margin-right:8px;vertical-align:middle}
.opt.ok{background:#d9f3d5;border-color:var(--good)}
.opt.no{background:#ffe0da;border-color:var(--bad)}
.explain{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--cream);font-weight:700;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.progress{font:800 14px var(--display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.gamebar{display:flex;justify-content:space-between;font:800 16px var(--display);margin-bottom:6px;font-variant-numeric:tabular-nums}
#gc{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#bfe8fb,#e9f8ff 75%,#8fd06b 75%);touch-action:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;border:3px solid var(--ink);border-radius:14px;background:var(--barn);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 0 6px,transparent 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.mc.up{background:#fff}
.mc.done{background:#d9f3d5;border-color:var(--good)}
.mc .e{font:30px/1 var(--emoji)}
.mc small{font:800 11px/1.1 var(--display);text-align:center}
.ficha-head{display:flex;gap:12px;align-items:center}
.ficha-head svg{width:96px;height:96px;flex:0 0 auto}
.facts{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;line-height:1.4;font-weight:700}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:12px 0 0}
dt{font:800 12px/1.6 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
dd{margin:0;font-weight:700;line-height:1.5}
.emo{font-family:var(--emoji);letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:400px){.foods{grid-template-columns:repeat(5,minmax(0,1fr))}.ring{width:42px;height:42px}.ring span{width:28px;height:28px;font-size:15px}.room{font-size:10px}.big{padding:6px 9px;font-size:14px}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="tabs" id="tabs" role="tablist" aria-label="Animales"></div>
    <div class="coins" title="Monedas"><i class="coin"></i><span id="coins">0</span></div>
    <button class="iconbtn" id="mute" aria-label="Sonido">🔊</button>
  </header>
  <div class="stats" id="stats"></div>
  <main class="scene" id="scene">
    <div class="deco" id="deco"></div>
    <div class="roomname" id="roomname"></div>
    <div class="pet" id="pet" role="button" aria-label="Acariciar"></div>
    <div class="garden" id="garden" hidden></div>
    <button class="prod" id="prod" hidden aria-label="Recoger producto"></button>
    <div class="dark"></div>
    <div class="fx" id="fx"></div>
    <div class="bubble" id="bubble" hidden></div>
  </main>
  <section class="tray" id="tray"></section>
  <nav class="rooms" id="rooms"></nav>
</div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<script>
/* ---------- datos ---------- */
const FOODS=[
 {id:'hierba',name:'Hierba',e:'🌿',p:2,n:16,f:2},
 {id:'trebol',name:'Trébol',e:'☘️',p:2,n:16,f:4},
 {id:'heno',name:'Heno',e:'🌾',p:3,n:22,f:2},
 {id:'maiz',name:'Maíz',e:'🌽',p:3,n:22,f:4},
 {id:'semillas',name:'Pipas de girasol',e:'🌻',p:2,n:14,f:3},
 {id:'zanahoria',name:'Zanahoria',e:'🥕',p:4,n:18,f:6},
 {id:'manzana',name:'Manzana',e:'🍎',p:5,n:16,f:8},
 {id:'lechuga',name:'Lechuga',e:'🥬',p:3,n:12,f:3},
 {id:'calabaza',name:'Calabaza',e:'🎃',p:5,n:26,f:6},
 {id:'gusano',name:'Gusano',e:'🐛',p:3,n:18,f:5,meat:true},
 {id:'pescado',name:'Pescado',e:'🐟',p:6,n:24,f:4,meat:true},
 {id:'pan',name:'Pan',e:'🍞',p:2,bad:'El pan casi no alimenta y les hincha la tripa. No es buena comida para patos ni para animales de granja.'},
 {id:'chocolate',name:'Chocolate',e:'🍫',p:4,bad:'El chocolate lleva teobromina, una sustancia tóxica para caballos, perros y muchos otros animales.'},
 {id:'aguacate',name:'Aguacate',e:'🥑',p:5,bad:'El aguacate contiene persina, que es tóxica para las aves y para animales de granja como vacas, ovejas y caballos.'},
];

 $('#pet').addEventListener('click',tickle);
 $('#prod').addEventListener('click',collect);
 $('#mute').onclick=()=>{state.muted=!state.muted;$('#mute').textContent=state.muted?'🔇':'🔊';save()};
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
 window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
 window.addEventListener('pointermove',e=>{const svg=$('#pet svg');if(!svg||$('#pet').hidden)return;const r=svg.getBoundingClientRect();
  const dx=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/r.width)),dy=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/r.height));
  svg.querySelectorAll('.pupil').forEach(p=>p.setAttribute('transform',`translate(${(dx*5).toFixed(1)} ${(dy*5).toFixed(1)})`))});
 (function blink(){setTimeout(()=>{const s=$('#pet svg');if(s&&!cs().asleep){s.classList.add('blink');setTimeout(()=>s.classList.remove('blink'),140)}blink()},2500+Math.random()*3000)})();
 let n=0;
 setInterval(()=>{decay(1,1);n++;
  for(const a of ANIMALS){if(!unlocked(a))continue;const v=state.animals[a.id];
   if(!v.sick&&!v.asleep&&(v.hyg<12||v.hunger<8)&&Math.random()<.01){v.sick=true;renderTabs();if(a.id===state.current){renderPet();sickMsg(a)}}}
  if(!eating)updateFace();renderStats();if(state.room==='huerto')renderGarden();
  if(n%5===0){renderTabs();save()}
  const v=cs(),a=cur();
  if($('#modal').hidden&&!v.asleep&&!v.sick&&$('#bubble').hidden&&Date.now()-complainAt>25000){const low=STATS.filter(s=>v[s.k]<30).sort((x,y)=>v[x.k]-v[y.k]);
   if(low.length){complainAt=Date.now();say(low[0].low.replace('sucio',g(a,'sucio','sucia')),true);sfx[a.id]()}}
 },1000);
 window.claude?.hot?.snapshot?.(()=>state);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
</html>
